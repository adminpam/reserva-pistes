# VirtualHost de ReservaPistes. El puerto real lo pone entrypoint.sh
# con el valor de la variable PORT que asigna Render.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
